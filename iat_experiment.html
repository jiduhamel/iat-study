<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IAT Experiment</title>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-iat-html@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <style>
    body, .jspsych-display-element, .jspsych-content-wrapper {
      background-color: #fff !important;
      color: #000 !important;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .jspsych-content { max-width: 800px; padding-top: 0.5em !important; padding-bottom: 0.5em !important; }
    .iat-word {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: bold;
      color: #000;
    }
    .iat-attr   { color: #000; }
    .iat-attr-b { color: #000; }
    .iat-face  { max-height: 160px; max-width: 200px; object-fit: cover; }
    .iat-error { font-size: 90px; font-weight: bold; color: red; line-height: 1; }
    .iat-bottom {
      margin-top: 40px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 15px;
      color: #555;
    }
    .instr-wrap {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      max-width: 680px;
      margin: 0 auto;
      text-align: left;
      color: #000;
    }
    .instr-wrap h2 { text-align: center; margin-bottom: 14px; font-size: 18px; }
    .key-box {
      display: inline-block;
      border: 2px solid #333;
      border-radius: 4px;
      padding: 1px 10px;
      font-family: monospace;
      font-size: 19px;
      font-weight: bold;
      background: #f0f0f0;
      color: #000;
    }
    .cat-tag {
      display: inline-block;
      background: #004080;
      color: #fff;
      border-radius: 4px;
      padding: 1px 10px;
      font-weight: bold;
    }
    .cat-tag.attr { background: #005f00; }
    .spacebar-note {
      margin-top: 28px;
      text-align: center;
      font-weight: bold;
      font-size: 19px;
    }
  </style>
</head>
<body>

<script>
"use strict";

/* ============================================================
   SECTION 1 — QUALTRICS INTEGRATION
   ============================================================
   Variables returned per IAT (prefix iat1_ / iat2_ / iat3_):
     d, da, db, pctCorrect, propRT300, exclude,
     rtCompatS, rtCompatL, rtIncompatS, rtIncompatL,
     conditionOrder (c-ic or ic-c, assigned independently per IAT — see
     groupForIAT below).
   Also: ResponseID, iatOrder (presentation order of the 3 tasks).
   In Qualtrics > Survey Flow > Embedded Data, add each field
   and set source to "Set from Survey URL".

   Only pre-aggregated summary stats travel to Qualtrics (a URL query
   string can't hold ~540 raw trial rows). The full raw trial-by-trial
   data (every stimulus, key, rt, correct, block) is saved separately —
   see SECTION 1b — so D-scores can be recomputed independently later.
   ============================================================ */

const QUALTRICS_SURVEY_URL =
  "https://maastrichtuniversity.eu.qualtrics.com/jfe/form/SV_0Aomaip2uYrqD4y";

const URL_PARAMS  = new URLSearchParams(window.location.search);
const RESPONSE_ID = URL_PARAMS.get("Q_ResponseID") || URL_PARAMS.get("ResponseID") || URL_PARAMS.get("rid") || "";
const SUBJECT_ID  = URL_PARAMS.get("subject_ID") || "";

/* ============================================================
   SECTION 1b — RAW DATA EXPORT (jsPsych DataPipe)
   ============================================================
   Sends the complete raw trial-by-trial dataset as a CSV to
   https://pipe.jspsych.org, so it can be downloaded afterwards and used
   to recompute D-scores (or anything else) independently of the
   in-browser computeDScore() below.

   Setup (one-time):
     1. Create a project at https://pipe.jspsych.org (log in with OSF).
     2. Copy its Experiment ID and paste it into DATAPIPE_EXPERIMENT_ID.
     3. In the OSF project, files will appear per participant as
        <subject_or_response_id>_<timestamp>.csv.
   If DATAPIPE_EXPERIMENT_ID is left unconfigured, the save is skipped
   (with a console warning) and only the Qualtrics summary stats survive.

   Testing: append ?debug=1 to the URL to log the CSV to the browser
   console instead of POSTing it to DataPipe — lets you eyeball column
   names/values (block tags, rt, correct) without seeding the real OSF
   project with test runs.
   ============================================================ */

const DATAPIPE_EXPERIMENT_ID = "cDHk3ROLx3Vg";
const DEBUG_MODE = URL_PARAMS.get("debug") === "1";

async function saveRawDataToPipe(filenameBase, csvString) {
  if (DEBUG_MODE) {
    console.log(`[debug] Would save "${filenameBase}.csv" to DataPipe:`);
    console.log(csvString);
    return;
  }
  if (!DATAPIPE_EXPERIMENT_ID || DATAPIPE_EXPERIMENT_ID.startsWith("PASTE-")) {
    console.warn("DATAPIPE_EXPERIMENT_ID not configured — raw trial data was not saved.");
    return;
  }
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);
  try {
    await fetch("https://pipe.jspsych.org/api/data/", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        experimentID: DATAPIPE_EXPERIMENT_ID,
        filename:     `${filenameBase}.csv`,
        data:         csvString,
      }),
      signal: controller.signal,
    });
  } catch (err) {
    // Don't block the participant's return to Qualtrics on a failed/slow save.
    console.error("DataPipe save failed:", err);
  } finally {
    clearTimeout(timer);
  }
}

// Deterministic hash of a string so the same participant always gets the
// same assignment if they reload, while assignments are balanced across
// participants (odd/even hash bit acts like a coin flip).
function _hashString(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

// All condition assignment (compatible/incompatible order per IAT, IAT
// presentation order) is derived by hashing an identifier, so it must be
// stable across reloads AND across devices/browsers for the same
// participant. subject_ID (the student ID number, entered by the
// participant on a required Qualtrics question and piped into the launch
// URL) is used as the primary identifier for exactly that reason: unlike
// Qualtrics' internal ResponseID (not always finalized when the page first
// loads) or a locally-stored ID (bound to one browser/device), the student
// ID is guaranteed present and identical no matter where the participant
// opens the link.
function getFallbackParticipantID() {
  const STORAGE_KEY = "iat_fallback_participant_id";
  const makeID = () => "local_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2);
  try {
    let id = window.localStorage.getItem(STORAGE_KEY);
    if (!id) {
      id = makeID();
      window.localStorage.setItem(STORAGE_KEY, id);
    }
    return id;
  } catch (e) {
    // localStorage unavailable (e.g. private browsing) — condition can't be
    // made reproducible across reloads in this case.
    return makeID();
  }
}

// Priority: student ID (subject_ID) > Qualtrics ResponseID > locally-stored
// fallback. The first two come from the survey URL and are reproducible
// across any device; the last is a last-resort safety net for testing the
// file outside Qualtrics (e.g. opening it directly with no query string).
const EFFECTIVE_ID = SUBJECT_ID || RESPONSE_ID || getFallbackParticipantID();

// Counterbalancing: compatible-first ("a") vs incompatible-first ("b"),
// assigned INDEPENDENTLY for each of the 3 IATs (hash of EFFECTIVE_ID + IAT
// name) rather than once globally. A single global assignment would give
// every participant the same block order (compatible-first or
// incompatible-first) in all three IATs, letting order effects accumulate
// identically across tasks instead of being balanced out.
function groupForIAT(name) {
  return _hashString(EFFECTIVE_ID + "_" + name) % 2 === 0 ? "a" : "b";
}

// IAT presentation order counterbalancing: 6 possible orderings of 3 IATs.
// Uses a deterministic hash of EFFECTIVE_ID so the same participant always
// gets the same order if they reload, and order is balanced across participants.
const IAT_ORDER_IDX = _hashString(EFFECTIVE_ID) % 6;



/* ============================================================
   SECTION 2 — STIMULI  (matched exactly to Inquisit files)
   ============================================================ */

// ── IAT 1: Age IAT  (ageiat_stimuli_inc.iqjs) ────────────────────────
// targetA = Young (LEFT in compatible); targetB = Old (RIGHT in compatible)
// attrA   = Good;  attrB = Bad
const AGE_TARGET_A_LABEL = "Young";
const AGE_TARGET_B_LABEL = "Old";
const AGE_ATTR_A_LABEL   = "Good";
const AGE_ATTR_B_LABEL   = "Bad";

const YOUNG_FACES = [
  { src: "images/young_f1.jpg", alt: "Young face 1" },
  { src: "images/young_f2.jpg", alt: "Young face 2" },
  { src: "images/young_f3.jpg", alt: "Young face 3" },
  { src: "images/young_f4.jpg", alt: "Young face 4" },
  { src: "images/young_f5.jpg", alt: "Young face 5" },
  { src: "images/young_f6.jpg", alt: "Young face 6" },
];
const OLD_FACES = [
  { src: "images/old_f1.jpg", alt: "Older face 1" },
  { src: "images/old_f2.jpg", alt: "Older face 2" },
  { src: "images/old_f3.jpg", alt: "Older face 3" },
  { src: "images/old_f4.jpg", alt: "Older face 4" },
  { src: "images/old_f5.jpg", alt: "Older face 5" },
  { src: "images/old_f6.jpg", alt: "Older face 6" },
];
// 8 attribute words each — matched to ageiat_stimuli_inc.iqjs
const AGE_ATTR_A = ["Joy", "Love", "Peace", "Wonderful", "Pleasure", "Glorious", "Laughter", "Happy"];
const AGE_ATTR_B = ["Agony", "Terrible", "Horrible", "Nasty", "Evil", "Awful", "Failure", "Hurt"];

// ── IAT 2: Future Self IAT  (futureselfiat_stimuli_inc.iqjs) ─────────
// targetA = Current Self (LEFT); targetB = Future Self (RIGHT)
// attrA   = Pleasant;  attrB = Unpleasant
const FS_TARGET_A_LABEL = "Current Self";
const FS_TARGET_B_LABEL = "Future Self";
const FS_ATTR_A_LABEL   = "Pleasant";
const FS_ATTR_B_LABEL   = "Unpleasant";

const CURRENT_SELF = ["Current Me", "Present Self", "Myself now", "Current Self"];
const FUTURE_SELF  = ["Future Me", "Future Self", "Myself later", "Older Self"];
const FS_ATTR_A    = ["Joy", "Warmth", "Gold", "Happy", "Smile", "Pleasure"];
const FS_ATTR_B    = ["Vomit", "Agony", "Pain", "Stink", "Filth", "Death"];

// ── IAT 3: Self-Esteem IAT  (selfesteemiat_stimuli_inc.iqjs) ─────────
// targetA = Self (LEFT); targetB = Other (RIGHT)
// attrA   = Pleasant;  attrB = Unpleasant  (same words as IAT 2)
const SE_TARGET_A_LABEL = "Self";
const SE_TARGET_B_LABEL = "Other";
const SE_ATTR_A_LABEL   = "Pleasant";
const SE_ATTR_B_LABEL   = "Unpleasant";

const SELF_WORDS  = ["I", "Me", "My", "Mine", "Self"];
const OTHER_WORDS = ["They", "Them", "Their", "Theirs", "Others"];
const SE_ATTR_A   = FS_ATTR_A;
const SE_ATTR_B   = FS_ATTR_B;


/* ============================================================
   SECTION 3 — UTILITIES
   ============================================================ */

const LEFT_KEY  = "e";
const RIGHT_KEY = "i";
const ISI_MS    = 250;   // inter-stimulus interval (Inquisit default: isi = 250)

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Cycle through arr in random order (no replacement within each cycle)
// to fill exactly n slots — mirrors Inquisit random() selection behaviour.
function fillN(arr, n) {
  const out = [];
  while (out.length < n) out.push(...shuffle(arr));
  return out.slice(0, n);
}

function targetHTML(w)      { return `<span class="iat-word">${w}</span>`; }
function attrHTML(w, isB)   { return `<span class="iat-word ${isB ? "iat-attr-b" : "iat-attr"}">${w}</span>`; }
function faceHTML(f)        { return `<img class="iat-face" src="${f.src}" alt="${f.alt}">`; }

// Build one IAT trial.
// Uses the plugin's native force_correct_key_press so an incorrect response
// keeps the SAME stimulus on screen, shows the red X, and waits for the
// correct key within this one trial — no separate trial/re-render, matching
// conventional IAT software. The plugin only records rt to the *first*
// keypress, so on_start/on_finish are used to record our own rt spanning
// stimulus onset through the eventual correct response.
function makeTrial(item, isAttr, keyAssoc, leftLbl, rightLbl, blockTag) {
  const isImage  = typeof item === "object" && item.src;
  const stimHTML = isAttr  ? attrHTML(item, keyAssoc === "right")
                 : isImage ? faceHTML(item)
                 : targetHTML(item);

  const errorReminder =
    `<div style="position:fixed;bottom:10px;left:0;right:0;text-align:center;` +
    `font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;color:#888;">` +
    `If you make an error, a red X will appear. Press the other key to continue.</div>`;

  let stimOnset;
  const mainTrial = {
    type:                    jsPsychIatHtml,
    stimulus:                stimHTML + errorReminder,
    stim_key_association:    keyAssoc,
    left_category_key:       LEFT_KEY,
    right_category_key:      RIGHT_KEY,
    left_category_label:     leftLbl,
    right_category_label:    rightLbl,
    display_feedback:        true,
    html_when_wrong:         `<span style="color:red;font-size:80px;font-weight:bold;display:block;text-align:center;line-height:1;margin-top:10px">X</span>`,
    force_correct_key_press: true,
    trial_duration:          null,
    response_ends_trial:     true,
    post_trial_gap:          ISI_MS,
    data:                    { block: blockTag },
    on_start:                function ()     { stimOnset = performance.now(); },
    on_finish:               function (data) { data.rt = Math.round(performance.now() - stimOnset); },
  };

  return { timeline: [mainTrial] };
}

// Single-category block (target-only or attribute-only practice).
// Returns n shuffled trials.
function makeSingleBlock(leftItems, rightItems, isAttr, leftLbl, rightLbl, blockTag, n) {
  const left  = fillN(leftItems,  Math.ceil(n / 2)).map(i => makeTrial(i, isAttr, "left",  leftLbl, rightLbl, blockTag));
  const right = fillN(rightItems, Math.floor(n / 2)).map(i => makeTrial(i, isAttr, "right", leftLbl, rightLbl, blockTag));
  return shuffle([...left, ...right]);
}

// Combined (double-category) block with strict attr->target alternation.
// Matches Inquisit: even trial positions = attributes, odd = targets
// (counting from 1 after the instruction slide).
// n must be even; half the trials are attributes, half are targets.
function makeCombinedBlock(leftTargets, rightTargets, leftAttrs, rightAttrs,
                           leftLbl, rightLbl, blockTag, n) {
  const half = n / 2;

  const attrPool = shuffle([
    ...fillN(leftAttrs,  Math.ceil(half / 2)).map(i => makeTrial(i, true,  "left",  leftLbl, rightLbl, blockTag)),
    ...fillN(rightAttrs, Math.floor(half / 2)).map(i => makeTrial(i, true,  "right", leftLbl, rightLbl, blockTag)),
  ]);
  const targetPool = shuffle([
    ...fillN(leftTargets,  Math.ceil(half / 2)).map(i => makeTrial(i, false, "left",  leftLbl, rightLbl, blockTag)),
    ...fillN(rightTargets, Math.floor(half / 2)).map(i => makeTrial(i, false, "right", leftLbl, rightLbl, blockTag)),
  ]);

  // Interleave: attr, target, attr, target …
  const result = [];
  for (let i = 0; i < half; i++) result.push(attrPool[i], targetPool[i]);
  return result;
}

// Instruction slide (advances on spacebar).
function instrSlide(html) {
  return {
    type:     jsPsychHtmlKeyboardResponse,
    stimulus: `<div class="instr-wrap">${html}</div>`,
    choices:  [" "],
    data:     { block: "instructions" },
  };
}

// Styled helpers for instruction text
const K  = k   => `<span class="key-box">${k.toUpperCase()}</span>`;
const TT = lbl => `<span class="cat-tag">${lbl}</span>`;
const TA = lbl => `<span class="cat-tag attr">${lbl}</span>`;


/* ============================================================
   SECTION 4 — D-SCORE CALCULATOR
   ============================================================
   Two-part improved D algorithm (Greenwald, Nosek & Banaji, 2003):
     da = (M_incompat_short - M_compat_short) / SD_pooled_short
     db = (M_incompat_long  - M_compat_long)  / SD_pooled_long
     d  = (da + db) / 2

   SD_pooled_short = SD of all valid RTs in compat-short + incompat-short
   SD_pooled_long  = SD of all valid RTs in compat-long  + incompat-long

   Valid = RT <= 10 000 ms (excluded from D-score only).
   propRT300 = proportion of ALL test-block trials with RT < 300 ms.
   excludeCriteriaMet = 1 if propRT300 > 0.10 (Greenwald et al. 2003 p.214).

   D-score interpretation (same thresholds as Inquisit output):
     |d| >= 0.65 => strong;  >= 0.35 => moderate;  >= 0.15 => slight
   ============================================================ */

function computeDScore(allData, prefix) {
  // Each trial's rt already spans stimulus onset through the eventual correct
  // response (see makeTrial: force_correct_key_press keeps the trial open on
  // an error, and on_finish records total elapsed time), matching how
  // conventional IAT software times error trials. No merging needed.
  const byTag = tag => allData.filter(d => d.block === tag);

  const sc = byTag(prefix + "_sc");
  const lc = byTag(prefix + "_lc");
  const si = byTag(prefix + "_si");
  const li = byTag(prefix + "_li");
  const all4 = [...sc, ...lc, ...si, ...li];

  // propRT300: ALL test-block trials, no RT ceiling
  const propRT300 = all4.length > 0
    ? all4.filter(d => d.rt < 300).length / all4.length : 0;

  // Exclude RT > 10 000 ms for D-score
  const valid = trials => trials.filter(d => d.rt !== null && d.rt <= 10000);
  const scV = valid(sc), lcV = valid(lc), siV = valid(si), liV = valid(li);

  function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0; }

  function pooledSD(a, b) {
    const combined = [...a, ...b];
    if (combined.length < 2) return 1;
    const m = mean(combined);
    return Math.sqrt(combined.reduce((s, x) => s + (x - m) * (x - m), 0) / combined.length) || 1;
  }

  const scRTs = scV.map(d => d.rt), siRTs = siV.map(d => d.rt);
  const lcRTs = lcV.map(d => d.rt), liRTs = liV.map(d => d.rt);

  const sda = pooledSD(scRTs, siRTs);
  const sdb = pooledSD(lcRTs, liRTs);
  const da  = (mean(siRTs) - mean(scRTs)) / sda;
  const db  = (mean(liRTs) - mean(lcRTs)) / sdb;
  const d   = (da + db) / 2;

  const allValid   = [...scV, ...lcV, ...siV, ...liV];
  const pctCorrect = allValid.length
    ? allValid.filter(t => t.correct).length / allValid.length * 100 : 0;

  return {
    d:           +d.toFixed(3),
    da:          +da.toFixed(3),
    db:          +db.toFixed(3),
    pctCorrect:  +pctCorrect.toFixed(1),
    propRT300:   +propRT300.toFixed(3),
    exclude:     propRT300 > 0.10 ? 1 : 0,
    rtCompatS:   +mean(scRTs).toFixed(0),
    rtCompatL:   +mean(lcRTs).toFixed(0),
    rtIncompatS: +mean(siRTs).toFixed(0),
    rtIncompatL: +mean(liRTs).toFixed(0),
  };
}


/* ============================================================
   SECTION 5 — IAT TIMELINE BUILDER
   ============================================================
   Block structure (matched to Inquisit iat_inc.iqjs / pictureiat_inc.iqjs):

   Group a — compatible first (odd ResponseID):
     B1  Target practice          20 trials  targetA=LEFT
     B2  Attribute practice       20 trials
     B3  Compat short test        20 trials  tag: _sc
         [instruction slide]
     B5  Compat long test         40 trials  tag: _lc
     B6  Target switch practice   20 trials  targetB=LEFT
     B7  Incompat short test      20 trials  tag: _si
         [instruction slide]
     B9  Incompat long test       40 trials  tag: _li

   Group b — incompatible first (even ResponseID): same structure,
   sides and _sc/_si / _lc/_li tags swapped.
   ============================================================ */

function buildIAT(cfg) {
  const P           = cfg.name;
  const compatFirst = cfg.group === "a";

  // Side assignment depends on group
  const firstLeftTargets  = compatFirst ? cfg.targetA.stimuli : cfg.targetB.stimuli;
  const firstRightTargets = compatFirst ? cfg.targetB.stimuli : cfg.targetA.stimuli;
  const firstLeftTLabel   = compatFirst ? cfg.targetA.label   : cfg.targetB.label;
  const firstRightTLabel  = compatFirst ? cfg.targetB.label   : cfg.targetA.label;

  const switchLeftTargets  = compatFirst ? cfg.targetB.stimuli : cfg.targetA.stimuli;
  const switchRightTargets = compatFirst ? cfg.targetA.stimuli : cfg.targetB.stimuli;
  const switchLeftLabel    = compatFirst ? cfg.targetB.label   : cfg.targetA.label;
  const switchRightLabel   = compatFirst ? cfg.targetA.label   : cfg.targetB.label;

  // Attribute labels: attrA (good/pleasant) = green, attrB (bad/unpleasant) = red
  const attrALbl = ['<span style="color:#005f00;font-weight:bold">' + cfg.attrA.label + '</span>'];
  const attrBLbl = ['<span style="color:red;font-weight:bold">'     + cfg.attrB.label + '</span>'];

  // Category labels for combined blocks — 2-item arrays.
  // The plugin automatically inserts "or" between item[0] and item[1].
  // Layout rendered by plugin: attribute (colored) / or / target
  const firstCombLeft  = [
    '<span style="color:#005f00;font-weight:bold">' + cfg.attrA.label + '</span>',
    firstLeftTLabel
  ];
  const firstCombRight = [
    '<span style="color:red;font-weight:bold">'     + cfg.attrB.label + '</span>',
    firstRightTLabel
  ];
  const secondCombLeft  = [
    '<span style="color:#005f00;font-weight:bold">' + cfg.attrA.label + '</span>',
    switchLeftLabel
  ];
  const secondCombRight = [
    '<span style="color:red;font-weight:bold">'     + cfg.attrB.label + '</span>',
    switchRightLabel
  ];

  // Block tags — always identify compat vs incompat, regardless of order
  const scTag = compatFirst ? P + "_sc" : P + "_si";
  const lcTag = compatFirst ? P + "_lc" : P + "_li";
  const siTag = compatFirst ? P + "_si" : P + "_sc";
  const liTag = compatFirst ? P + "_li" : P + "_lc";

  // Instruction text helpers: attrA green, attrB red, targets bold
  const GN = lbl => `<span style="color:#005f00;font-weight:bold">'${lbl}'</span>`;
  const RD = lbl => `<span style="color:red;font-weight:bold">'${lbl}'</span>`;
  const BL = lbl => `<strong>'${lbl}'</strong>`;

  const tl = [];

  // ── IAT intro ────────────────────────────────────────────────────────────
  tl.push(instrSlide(cfg.intro));

  // ── B1: Target practice (20 trials) ──────────────────────────────────────
  // Inquisit instruction 1
  tl.push(instrSlide(
    `<p>Put your left finger on the ${K("e")} response key for items that belong to the category ${BL(firstLeftTLabel)}.</p>` +
    `<p>Put your right finger on the ${K("i")} response key for items that belong to the category ${BL(firstRightTLabel)}.</p>` +
    `<p>Items will appear one-by-one in the middle of the screen.</p>` +
    `<p>If you make an error, a red X will appear - to continue, press the other response key.</p>` +
    `<p>Go as fast as you can while making as few errors as possible.</p>` +
    `<p class="spacebar-note">Press the SPACE BAR to begin.</p>`
  ));
  tl.push(...makeSingleBlock(
    firstLeftTargets, firstRightTargets, false,
    [firstLeftTLabel], [firstRightTLabel],
    P + "_b1", 20
  ));

  // ── B2: Attribute practice (20 trials) ───────────────────────────────────
  // Inquisit instruction 2
  tl.push(instrSlide(
    `<p>Put your left finger on the ${K("e")} response key for items that belong to the category ${GN(cfg.attrA.label)}.</p>` +
    `<p>Put your right finger on the ${K("i")} response key for items that belong to the category ${RD(cfg.attrB.label)}.</p>` +
    `<p>If you make an error, a red X will appear - to continue, press the other response key.</p>` +
    `<p>Go as fast as you can while making as few errors as possible.</p>` +
    `<p class="spacebar-note">Press the SPACE BAR to begin.</p>`
  ));
  tl.push(...makeSingleBlock(
    cfg.attrA.words, cfg.attrB.words, true,
    attrALbl, attrBLbl,
    P + "_b2", 20
  ));

  // ── B3: First combined short test (20 trials) — D-score ──────────────────
  // Inquisit instruction 3
  tl.push(instrSlide(
    `<p>Press the left ${K("e")} key for ${GN(cfg.attrA.label)} and ${BL(firstLeftTLabel)}.</p>` +
    `<p>Press the right ${K("i")} key for ${RD(cfg.attrB.label)} and ${BL(firstRightTLabel)}.</p>` +
    `<p>Each item belongs to only one category.</p>` +
    `<p>If you make an error, a red X will appear - to continue, press the other response key.</p>` +
    `<p>Go as fast as you can while making as few errors as possible.</p>` +
    `<p class="spacebar-note">Press the SPACE BAR to begin.</p>`
  ));
  tl.push(...makeCombinedBlock(
    firstLeftTargets, firstRightTargets, cfg.attrA.words, cfg.attrB.words,
    firstCombLeft, firstCombRight, scTag, 20
  ));

  // ── Instruction between B3 and B5 (Inquisit instruction 4) ───────────────
  tl.push(instrSlide(
    `<p>This is the same task as the previous one.</p>` +
    `<br>` +
    `<p>Press the left ${K("e")} key for ${GN(cfg.attrA.label)} and ${BL(firstLeftTLabel)}.</p>` +
    `<p>Press the right ${K("i")} key for ${RD(cfg.attrB.label)} and ${BL(firstRightTLabel)}.</p>` +
    `<p>Each item belongs to only one category.</p>` +
    `<p>Go as fast as you can while making as few errors as possible.</p>` +
    `<p class="spacebar-note">Press the SPACE BAR to begin.</p>`
  ));

  // ── B5: First combined long test (40 trials) — D-score ───────────────────
  tl.push(...makeCombinedBlock(
    firstLeftTargets, firstRightTargets, cfg.attrA.words, cfg.attrB.words,
    firstCombLeft, firstCombRight, lcTag, 40
  ));

  // ── B6: Target switch practice (20 trials) ───────────────────────────────
  // Inquisit instruction 5
  tl.push(instrSlide(
    `<p>Attention! The labels have changed sides.</p>` +
    `<p>Press the left ${K("e")} key for ${BL(switchLeftLabel)}.</p>` +
    `<p>Press the right ${K("i")} key for ${BL(switchRightLabel)}.</p>` +
    `<p>Go as fast as you can while making as few errors as possible.</p>` +
    `<p class="spacebar-note">Press the SPACE BAR to begin.</p>`
  ));
  tl.push(...makeSingleBlock(
    switchLeftTargets, switchRightTargets, false,
    [switchLeftLabel], [switchRightLabel],
    P + "_b6", 20
  ));

  // ── B7: Second combined short test (20 trials) — D-score ─────────────────
  // Inquisit instruction 6
  tl.push(instrSlide(
    `<p>Press the left ${K("e")} key for ${GN(cfg.attrA.label)} and ${BL(switchLeftLabel)}.</p>` +
    `<p>Press the right ${K("i")} key for ${RD(cfg.attrB.label)} and ${BL(switchRightLabel)}.</p>` +
    `<p>If you make an error, a red X will appear - to continue, press the other response key.</p>` +
    `<p>Go as fast as you can while making as few errors as possible.</p>` +
    `<p class="spacebar-note">Press the SPACE BAR to begin.</p>`
  ));
  tl.push(...makeCombinedBlock(
    switchLeftTargets, switchRightTargets, cfg.attrA.words, cfg.attrB.words,
    secondCombLeft, secondCombRight, siTag, 20
  ));

  // ── Instruction between B7 and B9 (Inquisit instruction 7) ───────────────
  tl.push(instrSlide(
    `<p>This is the same task as the previous one.</p>` +
    `<p>Press the left ${K("e")} key for ${GN(cfg.attrA.label)} and ${BL(switchLeftLabel)}.</p>` +
    `<p>Press the right ${K("i")} key for ${RD(cfg.attrB.label)} and ${BL(switchRightLabel)}.</p>` +
    `<p>Each item belongs to only one category.</p>` +
    `<p>Go as fast as you can while making as few errors as possible.</p>` +
    `<p class="spacebar-note">Press the SPACE BAR to begin.</p>`
  ));

  // ── B9: Second combined long test (40 trials) — D-score ──────────────────
  tl.push(...makeCombinedBlock(
    switchLeftTargets, switchRightTargets, cfg.attrA.words, cfg.attrB.words,
    secondCombLeft, secondCombRight, liTag, 40
  ));

  // ── Between-IAT break ─────────────────────────────────────────────────────
  if (cfg.num < 3) {
    tl.push(instrSlide(
      `<p style="text-align:center;font-size:20px;font-weight:bold">Task ${cfg.num} complete!</p>` +
      `<p>You may take a short break.</p>` +
      `<p>Task ${cfg.num + 1} of 3 begins when you press the SPACE BAR.</p>` +
      `<p class="spacebar-note">Press the SPACE BAR to continue.</p>`
    ));
  }

  return tl;
}


/* ============================================================
   SECTION 6 — IAT CONFIGURATIONS
   ============================================================ */

const IAT1 = {
  name: "iat1", num: 1, group: groupForIAT("iat1"),
  targetA: { label: AGE_TARGET_A_LABEL, stimuli: YOUNG_FACES },
  targetB: { label: AGE_TARGET_B_LABEL, stimuli: OLD_FACES   },
  attrA:   { label: AGE_ATTR_A_LABEL,   words:   AGE_ATTR_A  },
  attrB:   { label: AGE_ATTR_B_LABEL,   words:   AGE_ATTR_B  },
  intro:
    `<p style="text-align:center;font-size:20px;font-weight:bold">Task 1 of 3</p>` +
    `<p>In this task, you will see <strong>faces of young and older adults</strong>, ` +
    `along with words that are either <span style="color:#005f00;font-weight:bold">Good</span> ` +
    `or <span style="color:red;font-weight:bold">Bad</span>.</p>` +
    `<p><span style="color:#005f00;font-weight:bold">Good words:</span> ` +
    `Joy, Love, Peace, Wonderful, Pleasure, Glorious, Laughter, Happy</p>` +
    `<p><span style="color:red;font-weight:bold">Bad words:</span> ` +
    `Agony, Terrible, Horrible, Nasty, Evil, Awful, Failure, Hurt</p>` +
    `<p>Sort the items into categories as quickly as possible ` +
    `using the ${K("e")} key (left hand) and the ${K("i")} key (right hand).</p>` +
    `<p>Go <strong>as fast as you can</strong> while making as few errors as possible. ` +
    `If you make an error, a red <span style="color:red;font-weight:bold">X</span> will appear — ` +
    `press the other key to continue.</p>` +
    `<p class="spacebar-note">Press the SPACE BAR to begin.</p>`,
};

const IAT2 = {
  name: "iat2", num: 2, group: groupForIAT("iat2"),
  targetA: { label: FS_TARGET_A_LABEL, stimuli: CURRENT_SELF },
  targetB: { label: FS_TARGET_B_LABEL, stimuli: FUTURE_SELF  },
  attrA:   { label: FS_ATTR_A_LABEL,   words:   FS_ATTR_A    },
  attrB:   { label: FS_ATTR_B_LABEL,   words:   FS_ATTR_B    },
  intro:
    `<p style="text-align:center;font-size:20px;font-weight:bold">Task 2 of 3</p>` +
    `<p>In this task, you will see words related to your <strong>Current Self</strong> ` +
    `and your <strong>Future Self</strong>, along with words that are either ` +
    `<span style="color:#005f00;font-weight:bold">Pleasant</span> ` +
    `or <span style="color:red;font-weight:bold">Unpleasant</span>.</p>` +
    `<p><span style="color:#005f00;font-weight:bold">Pleasant words:</span> ` +
    `Joy, Warmth, Gold, Happy, Smile, Pleasure</p>` +
    `<p><span style="color:red;font-weight:bold">Unpleasant words:</span> ` +
    `Vomit, Agony, Pain, Stink, Filth, Death</p>` +
    `<p>Sort the items into categories as quickly as possible ` +
    `using the ${K("e")} key (left hand) and the ${K("i")} key (right hand).</p>` +
    `<p>Go <strong>as fast as you can</strong> while making as few errors as possible. ` +
    `If you make an error, a red <span style="color:red;font-weight:bold">X</span> will appear — ` +
    `press the other key to continue.</p>` +
    `<p class="spacebar-note">Press the SPACE BAR to begin.</p>`,
};

const IAT3 = {
  name: "iat3", num: 3, group: groupForIAT("iat3"),
  targetA: { label: SE_TARGET_A_LABEL, stimuli: SELF_WORDS  },
  targetB: { label: SE_TARGET_B_LABEL, stimuli: OTHER_WORDS },
  attrA:   { label: SE_ATTR_A_LABEL,   words:   SE_ATTR_A   },
  attrB:   { label: SE_ATTR_B_LABEL,   words:   SE_ATTR_B   },
  intro:
    `<p style="text-align:center;font-size:20px;font-weight:bold">Task 3 of 3</p>` +
    `<p>In this task, you will see words related to the <strong>Self</strong> ` +
    `and <strong>Others</strong>, along with words that are either ` +
    `<span style="color:#005f00;font-weight:bold">Pleasant</span> ` +
    `or <span style="color:red;font-weight:bold">Unpleasant</span>.</p>` +
    `<p><span style="color:#005f00;font-weight:bold">Pleasant words:</span> ` +
    `Joy, Warmth, Gold, Happy, Smile, Pleasure</p>` +
    `<p><span style="color:red;font-weight:bold">Unpleasant words:</span> ` +
    `Vomit, Agony, Pain, Stink, Filth, Death</p>` +
    `<p>Sort the items into categories as quickly as possible ` +
    `using the ${K("e")} key (left hand) and the ${K("i")} key (right hand).</p>` +
    `<p>Go <strong>as fast as you can</strong> while making as few errors as possible. ` +
    `If you make an error, a red <span style="color:red;font-weight:bold">X</span> will appear — ` +
    `press the other key to continue.</p>` +
    `<p class="spacebar-note">Press the SPACE BAR to begin.</p>`,
};


// Assign presentation order and patch "Task X of 3" labels to match actual order.
const IAT_ORDERS = [
  [IAT1, IAT2, IAT3],
  [IAT1, IAT3, IAT2],
  [IAT2, IAT1, IAT3],
  [IAT2, IAT3, IAT1],
  [IAT3, IAT1, IAT2],
  [IAT3, IAT2, IAT1],
];
const IAT_SEQUENCE  = IAT_ORDERS[IAT_ORDER_IDX];
const IAT_ORDER_LABEL = IAT_SEQUENCE.map(c => c.name.replace('iat', '')).join('-');
IAT_SEQUENCE.forEach((cfg, i) => {
  cfg.intro = cfg.intro.replace(/Task \d of 3/, `Task ${i + 1} of 3`);
});


/* ============================================================
   SECTION 7 — PRELOAD + OVERALL INTRODUCTION
   ============================================================ */

const preload = {
  type:              jsPsychPreload,
  images:            [...YOUNG_FACES, ...OLD_FACES].map(f => f.src),
  show_progress_bar: true,
  message:           "<p style='color:#000;font-family:\"Helvetica Neue\",Helvetica,Arial,sans-serif;font-size:18px'>Loading images…</p>",
  data:              { block: "preload" },
};

const overallIntro = instrSlide(
  "<h2 style='text-align:center'>Welcome</h2>" +
  "<p>This session contains <strong>three tasks</strong> (Implicit Association Tests).</p>" +
  "<p>Each task asks you to sort words and pictures into categories as quickly as possible " +
  "using the " + K("e") + " (left) and " + K("i") + " (right) keys.</p>" +
  "<p>Speed is important — work as fast as you can while keeping errors low.</p>" +
  "<p>The session takes approximately <strong>15–20 minutes</strong>. " +
  "Sit in a quiet place without distractions.</p>" +
  "<p class='spacebar-note'>Press SPACEBAR to begin.</p>"
);


/* ============================================================
   SECTION 8 — LAUNCH jsPsych
   ============================================================ */

const jsPsych = initJsPsych({
  show_progress_bar:    true,
  message_progress_bar: "Progress",
  on_trial_start: function () {},
  on_finish: async function () {
    const allData = jsPsych.data.get().values();

    const s1 = computeDScore(allData, "iat1");
    const s2 = computeDScore(allData, "iat2");
    const s3 = computeDScore(allData, "iat3");

    const params = new URLSearchParams({
      subject_ID:       SUBJECT_ID,
      iatOrder:         IAT_ORDER_LABEL,

      iat1_d:           s1.d,
      iat1_da:          s1.da,
      iat1_db:          s1.db,
      iat1_pctCorrect:  s1.pctCorrect,
      iat1_propRT300:   s1.propRT300,
      iat1_exclude:     s1.exclude,
      iat1_conditionOrder: IAT1.group === "a" ? "c-ic" : "ic-c",
      iat1_rtCompatS:   s1.rtCompatS,
      iat1_rtCompatL:   s1.rtCompatL,
      iat1_rtIncompatS: s1.rtIncompatS,
      iat1_rtIncompatL: s1.rtIncompatL,

      iat2_d:           s2.d,
      iat2_da:          s2.da,
      iat2_db:          s2.db,
      iat2_pctCorrect:  s2.pctCorrect,
      iat2_propRT300:   s2.propRT300,
      iat2_exclude:     s2.exclude,
      iat2_conditionOrder: IAT2.group === "a" ? "c-ic" : "ic-c",
      iat2_rtCompatS:   s2.rtCompatS,
      iat2_rtCompatL:   s2.rtCompatL,
      iat2_rtIncompatS: s2.rtIncompatS,
      iat2_rtIncompatL: s2.rtIncompatL,

      iat3_d:           s3.d,
      iat3_da:          s3.da,
      iat3_db:          s3.db,
      iat3_pctCorrect:  s3.pctCorrect,
      iat3_propRT300:   s3.propRT300,
      iat3_exclude:     s3.exclude,
      iat3_conditionOrder: IAT3.group === "a" ? "c-ic" : "ic-c",
      iat3_rtCompatS:   s3.rtCompatS,
      iat3_rtCompatL:   s3.rtCompatL,
      iat3_rtIncompatS: s3.rtIncompatS,
      iat3_rtIncompatL: s3.rtIncompatL,
    });

    // Raw trial-by-trial data (every stimulus, key, rt, correct, block) —
    // saved separately from the Qualtrics summary stats above so D-scores
    // can be recomputed independently later. See SECTION 1b.
    const idForFile = (SUBJECT_ID || EFFECTIVE_ID).replace(/[^a-zA-Z0-9_-]/g, "");
    await saveRawDataToPipe(`${idForFile}_${Date.now()}`, jsPsych.data.get().csv());

    document.body.innerHTML =
      "<div style='display:flex;flex-direction:column;align-items:center;" +
      "justify-content:center;height:100vh;" +
      "font-family:\"Helvetica Neue\",Helvetica,Arial,sans-serif;font-size:22px;" +
      "color:#000;background:#fff;'>" +
      "<p>Tasks complete. Thank you!</p>" +
      "<p style='font-size:16px;color:#555'>Returning to the survey…</p>" +
      "</div>";

    setTimeout(function () {
      window.location.href = QUALTRICS_SURVEY_URL + "?" + params.toString();
    }, 2000);
  },
});

jsPsych.run([
  preload,
  overallIntro,
  ...buildIAT(IAT_SEQUENCE[0]),
  ...buildIAT(IAT_SEQUENCE[1]),
  ...buildIAT(IAT_SEQUENCE[2]),
  {
    type:           jsPsychHtmlKeyboardResponse,
    stimulus:       "<p style='font-family:Helvetica,Arial,sans-serif;font-size:22px;color:#000'>All done! Saving results…</p>",
    trial_duration: 1500,
    choices:        "NO_KEYS",
    data:           { block: "end" },
  },
]);
</script>
