<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Future Self IAT (Pictorial)</title>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-iat-html@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&display=swap">
  <script src="iat_common.js"></script>
  <style>
    body, .jspsych-display-element, .jspsych-content-wrapper {
      background-color: #fff !important;
      color: #000 !important;
      font-family: "Google Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .jspsych-content { max-width: 1400px; padding-top: 0.5em !important; padding-bottom: 0.5em !important; }
    .iat-word {
      font-family: "Google Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: bold;
      color: #000;
    }
    .iat-attr   { color: #000; }
    .iat-attr-b { color: #000; }
    .iat-face  { max-height: 160px; max-width: 200px; object-fit: cover; }
    .iat-error { font-size: 90px; font-weight: bold; color: red; line-height: 1; }
    .instr-wrap {
      font-family: "Google Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      max-width: 680px;
      margin: 0 auto;
      text-align: left;
      color: #000;
    }
    .instr-wrap h2 { text-align: center; margin-bottom: 14px; font-size: 18px; }
    .key-box {
      display: inline-block;
      border: 2px solid #333;
      border-radius: 4px;
      padding: 1px 10px;
      font-family: monospace;
      font-size: 19px;
      font-weight: bold;
      background: #f0f0f0;
      color: #000;
    }
    .cat-tag {
      display: inline-block;
      background: #004080;
      color: #fff;
      border-radius: 4px;
      padding: 1px 10px;
      font-weight: bold;
    }
    .cat-tag.attr { background: #005f00; }
    .spacebar-note {
      margin-top: 28px;
      text-align: center;
      font-weight: bold;
      font-size: 19px;
    }
  </style>
</head>
<body>

<script>
"use strict";

/* ============================================================
   Future Self IAT — PICTORIAL version (standalone page)
   ============================================================
   Study design: this page runs AFTER iat0_photo_capture.html (photo +
   generation, done up front) and AFTER whichever other IAT (iat1–iat4)
   this participant was randomized to — so the future-self image has
   already been generated in the background while they did that other
   IAT, and this page has no waiting to do.

   HANDOFF: reads the result out of localStorage under
   FUTURE_SELF_STORAGE_KEY, written by iat0_photo_capture.html on the
   same origin/browser, and deletes it once read (single use). If it's
   missing — a different device/browser, iat0 was skipped, or generation
   failed there — this page has no stimuli to show and skips straight to
   redirecting back to Qualtrics with iat5_exclude=1 /
   iat5_generationFailed=1.

   PRIVACY: the retrieved photo/image(s) are kept in plain JS variables
   only — never attached as jsPsych trial `data`, so never written into
   the raw-trial DataPipe CSV or the Qualtrics embedded-data params.

   Embedded data returned to Qualtrics: subject_ID, iat5_d, iat5_da,
   iat5_db, iat5_pctCorrect, iat5_propRT300, iat5_exclude,
   iat5_generationFailed, iat5_conditionOrder, iat5_rtCompatS/L,
   iat5_rtIncompatS/L.
   ============================================================ */

// attrA = Pleasant; attrB = Unpleasant — same words as the textual Future Self IAT
const FS_ATTR_A = ["Joy", "Warmth", "Gold", "Happy", "Smile", "Pleasure"];
const FS_ATTR_B = ["Vomit", "Agony", "Pain", "Stink", "Filth", "Death"];

const FUTURE_SELF_STORAGE_KEY = `iat_future_self_${EFFECTIVE_ID}`;

// Reads and consumes (single-use) the handoff written by
// iat0_photo_capture.html. Returns null if absent, malformed, or flagged
// as a failed generation there.
function loadFutureSelfData() {
  let raw;
  try {
    raw = localStorage.getItem(FUTURE_SELF_STORAGE_KEY);
  } catch (e) {
    console.error("Could not read localStorage:", e);
    return null;
  }
  if (!raw) return null;
  try {
    localStorage.removeItem(FUTURE_SELF_STORAGE_KEY);
  } catch (e) { /* not fatal */ }
  try {
    const parsed = JSON.parse(raw);
    if (parsed.failed || !parsed.selfPhoto || !Array.isArray(parsed.futureImages) || !parsed.futureImages.length) {
      return null;
    }
    return parsed;
  } catch (e) {
    console.error("Could not parse stored future-self data:", e);
    return null;
  }
}

// Target A (Current Self) is the participant's own captured photo — only
// one exemplar exists, so it repeats across trials (unlike a
// multi-exemplar picture set). Target B (Future Self) uses whatever
// number of images the backend returned.
function buildFutureSelfIAT(selfPhotoDataURL, futureSelfImages) {
  const selfImages   = [{ src: selfPhotoDataURL, alt: "Your photo" }];
  const futureImages = futureSelfImages.map((src, i) => ({ src, alt: `Future self image ${i + 1}` }));
  return {
    name: "iat5", group: groupForIAT("iat5"),
    targetA: { label: "Current Self", stimuli: selfImages   },
    targetB: { label: "Future Self",  stimuli: futureImages },
    attrA:   { label: "Pleasant",     words:   FS_ATTR_A    },
    attrB:   { label: "Unpleasant",   words:   FS_ATTR_B    },
    intro:
      `<p style="text-align:center;font-size:20px;font-weight:bold">Future Self IAT</p>` +
      `<p>In this task, you will see <strong>your own photo</strong> and a ` +
      `<strong>computer-generated image of your future self</strong>, ` +
      `along with words that are either <span style="color:#005f00;font-weight:bold">Pleasant</span> ` +
      `or <span style="color:red;font-weight:bold">Unpleasant</span>.</p>` +
      `<p><span style="color:#005f00;font-weight:bold">Pleasant words:</span> ` +
      `Joy, Warmth, Gold, Happy, Smile, Pleasure</p>` +
      `<p><span style="color:red;font-weight:bold">Unpleasant words:</span> ` +
      `Vomit, Agony, Pain, Stink, Filth, Death</p>` +
      `<p>Sort the items into categories as quickly as possible ` +
      `using the ${K("e")} key (left hand) and the ${K("i")} key (right hand).</p>` +
      `<p>Go <strong>as fast as you can</strong> while making as few errors as possible. ` +
      `If you make an error, a red <span style="color:red;font-weight:bold">X</span> will appear — ` +
      `press the other key to continue.</p>` +
      `<p class="spacebar-note">Press the SPACE BAR to begin.</p>`,
  };
}

const skippedTrial = {
  type:     jsPsychHtmlKeyboardResponse,
  stimulus:
    "<div class='instr-wrap' style='text-align:center'>" +
    "<p>We couldn't find your future-self image for this task.</p>" +
    "<p style='font-size:14px;color:#555'>Continuing…</p></div>",
  choices:        "NO_KEYS",
  trial_duration: 2000,
  data:           { block: "iat5_skipped" },
};

let IAT5 = null;
let iat5GenerationFailed = false;

function skipToEnd() {
  const extra = { iat5_generationFailed: iat5GenerationFailed ? 1 : 0 };
  if (iat5GenerationFailed) extra.iat5_exclude = 1;
  finishAndReturnToQualtrics(jsPsych, "iat5", IAT5 ? IAT5.group : groupForIAT("iat5"), extra);
}

const jsPsych = initJsPsych({
  show_progress_bar:    true,
  message_progress_bar: "Progress",
  on_finish: skipToEnd,
});

addSkipButtonIfEnabled(skipToEnd);

const futureSelfData = loadFutureSelfData();
let timeline;
if (futureSelfData) {
  IAT5 = buildFutureSelfIAT(futureSelfData.selfPhoto, futureSelfData.futureImages);
  timeline = [...buildIAT(IAT5), finalTrial];
} else {
  iat5GenerationFailed = true;
  timeline = [skippedTrial, finalTrial];
}

jsPsych.run(timeline);
</script>
</body>
</html>
