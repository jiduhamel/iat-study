<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age IAT (Pictorial)</title>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-iat-html@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <script src="iat_common.js"></script>
  <style>
    body, .jspsych-display-element, .jspsych-content-wrapper {
      background-color: #fff !important;
      color: #000 !important;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .jspsych-content { max-width: 800px; padding-top: 0.5em !important; padding-bottom: 0.5em !important; }
    .iat-word {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: bold;
      color: #000;
    }
    .iat-attr   { color: #000; }
    .iat-attr-b { color: #000; }
    .iat-face  { max-height: 160px; max-width: 200px; object-fit: cover; }
    .iat-error { font-size: 90px; font-weight: bold; color: red; line-height: 1; }
    .instr-wrap {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      max-width: 680px;
      margin: 0 auto;
      text-align: left;
      color: #000;
    }
    .instr-wrap h2 { text-align: center; margin-bottom: 14px; font-size: 18px; }
    .key-box {
      display: inline-block;
      border: 2px solid #333;
      border-radius: 4px;
      padding: 1px 10px;
      font-family: monospace;
      font-size: 19px;
      font-weight: bold;
      background: #f0f0f0;
      color: #000;
    }
    .cat-tag {
      display: inline-block;
      background: #004080;
      color: #fff;
      border-radius: 4px;
      padding: 1px 10px;
      font-weight: bold;
    }
    .cat-tag.attr { background: #005f00; }
    .spacebar-note {
      margin-top: 28px;
      text-align: center;
      font-weight: bold;
      font-size: 19px;
    }
  </style>
</head>
<body>

<script>
"use strict";

/* ============================================================
   Age IAT — PICTORIAL version (standalone page)
   Split out of the combined 5-task experiment so Qualtrics can randomly
   route participants to this IAT alone as part of a 2x2 design. See
   iat_common.js for the shared engine (trial builder, D-score
   calculator, Qualtrics/DataPipe plumbing).

   Embedded data returned to Qualtrics: subject_ID, iat1_d, iat1_da,
   iat1_db, iat1_pctCorrect, iat1_propRT300, iat1_exclude,
   iat1_conditionOrder, iat1_rtCompatS/L, iat1_rtIncompatS/L.
   ============================================================ */

// targetA = Young (LEFT in compatible); targetB = Old (RIGHT in compatible)
// attrA   = Good;  attrB = Bad — matched to ageiat_stimuli_inc.iqjs
const YOUNG_FACES = [
  { src: "images/young_f1.jpg", alt: "Young face 1" },
  { src: "images/young_f2.jpg", alt: "Young face 2" },
  { src: "images/young_f3.jpg", alt: "Young face 3" },
  { src: "images/young_f4.jpg", alt: "Young face 4" },
  { src: "images/young_f5.jpg", alt: "Young face 5" },
  { src: "images/young_f6.jpg", alt: "Young face 6" },
];
const OLD_FACES = [
  { src: "images/old_f1.jpg", alt: "Older face 1" },
  { src: "images/old_f2.jpg", alt: "Older face 2" },
  { src: "images/old_f3.jpg", alt: "Older face 3" },
  { src: "images/old_f4.jpg", alt: "Older face 4" },
  { src: "images/old_f5.jpg", alt: "Older face 5" },
  { src: "images/old_f6.jpg", alt: "Older face 6" },
];
const AGE_ATTR_A = ["Joy", "Love", "Peace", "Wonderful", "Pleasure", "Glorious", "Laughter", "Happy"];
const AGE_ATTR_B = ["Agony", "Terrible", "Horrible", "Nasty", "Evil", "Awful", "Failure", "Hurt"];

const IAT1 = {
  name: "iat1", group: groupForIAT("iat1"),
  targetA: { label: "Young", stimuli: YOUNG_FACES },
  targetB: { label: "Old",   stimuli: OLD_FACES   },
  attrA:   { label: "Good",  words:   AGE_ATTR_A  },
  attrB:   { label: "Bad",   words:   AGE_ATTR_B  },
  intro:
    `<p style="text-align:center;font-size:20px;font-weight:bold">Age IAT</p>` +
    `<p>In this task, you will see <strong>faces of young and older adults</strong>, ` +
    `along with words that are either <span style="color:#005f00;font-weight:bold">Good</span> ` +
    `or <span style="color:red;font-weight:bold">Bad</span>.</p>` +
    `<p><span style="color:#005f00;font-weight:bold">Good words:</span> ` +
    `Joy, Love, Peace, Wonderful, Pleasure, Glorious, Laughter, Happy</p>` +
    `<p><span style="color:red;font-weight:bold">Bad words:</span> ` +
    `Agony, Terrible, Horrible, Nasty, Evil, Awful, Failure, Hurt</p>` +
    `<p>Sort the items into categories as quickly as possible ` +
    `using the ${K("e")} key (left hand) and the ${K("i")} key (right hand).</p>` +
    `<p>Go <strong>as fast as you can</strong> while making as few errors as possible. ` +
    `If you make an error, a red <span style="color:red;font-weight:bold">X</span> will appear — ` +
    `press the other key to continue.</p>` +
    `<p class="spacebar-note">Press the SPACE BAR to begin.</p>`,
};

const preload = {
  type:              jsPsychPreload,
  images:            [...YOUNG_FACES, ...OLD_FACES].map(f => f.src),
  show_progress_bar: true,
  message:           "<p style='color:#000;font-family:\"Helvetica Neue\",Helvetica,Arial,sans-serif;font-size:18px'>Loading images…</p>",
  data:              { block: "preload" },
};

const jsPsych = initJsPsych({
  show_progress_bar:    true,
  message_progress_bar: "Progress",
  on_trial_start: function () {
    addSkipButtonIfEnabled(() => finishAndReturnToQualtrics(jsPsych, "iat1", IAT1.group));
  },
  on_finish: function () {
    finishAndReturnToQualtrics(jsPsych, "iat1", IAT1.group);
  },
});

jsPsych.run([
  preload,
  ...buildIAT(IAT1),
  finalTrial,
]);
</script>
</body>
</html>
