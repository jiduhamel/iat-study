<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Capture</title>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-initialize-camera@1.0.2"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <script src="iat_common.js"></script>
  <style>
    body, .jspsych-display-element, .jspsych-content-wrapper {
      background-color: #fff !important;
      color: #000 !important;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .jspsych-content { max-width: 800px; padding-top: 0.5em !important; padding-bottom: 0.5em !important; }
    .instr-wrap {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      max-width: 680px;
      margin: 0 auto;
      text-align: left;
      color: #000;
    }
    .instr-wrap h2 { text-align: center; margin-bottom: 14px; font-size: 18px; }
    .spacebar-note {
      margin-top: 28px;
      text-align: center;
      font-weight: bold;
      font-size: 19px;
    }
  </style>
</head>
<body>

<script>
"use strict";

/* ============================================================
   Photo Capture (standalone page — run FIRST, before any IAT)
   ============================================================
   Study design: the participant takes their webcam photo here, first,
   before being routed by Qualtrics to whichever single IAT they were
   randomized to (iat1–iat4). Future-self image generation is kicked off
   right after the photo is taken and is awaited HERE (not on the later
   Future Self IAT page), so by the time the participant reaches
   iat5_future_self_pictorial.html — after completing their assigned
   IAT — the image is already sitting in localStorage, ready to use with
   no further wait.

   HANDOFF: because each IAT is a separate page/URL (a fresh JS context,
   with any in-memory Promise lost on navigation), the captured photo and
   generated image(s) are written to localStorage under a per-participant
   key (same-origin, so this only works if the whole flow stays on this
   domain and in the same browser/device). iat5_future_self_pictorial.html
   reads and consumes that entry. If it's missing (e.g. a different
   device, or generation failed here), iat5 skips itself and flags
   iat5_exclude=1.

   PRIVACY: nothing here is attached as jsPsych trial `data` — only a
   status flag travels back to Qualtrics. The photo/generated image(s)
   live in localStorage only until iat5 consumes (and deletes) them.

   BACKEND CONTRACT (fill in FUTURE_SELF_API_URL once available):
     POST FUTURE_SELF_API_URL
     body: { subject_ID: string, photo: "<jpeg data URL>" }
     expected 200 response JSON: { images: ["<data URL or https URL>", ...] }
   ============================================================ */

const FUTURE_SELF_API_URL = "PASTE-FUTURE-SELF-API-ENDPOINT-HERE"; // TODO: set once the backend team provides it
const FUTURE_SELF_GENERATION_TIMEOUT_MS = 90000;
const FUTURE_SELF_STORAGE_KEY = `iat_future_self_${EFFECTIVE_ID}`;

function withTimeout(promise, ms, message) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms)),
  ]);
}

async function generateFutureSelfImages(photoDataURL) {
  if (!FUTURE_SELF_API_URL || FUTURE_SELF_API_URL.startsWith("PASTE-")) {
    throw new Error("FUTURE_SELF_API_URL is not configured.");
  }
  const response = await withTimeout(
    fetch(FUTURE_SELF_API_URL, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ subject_ID: SUBJECT_ID || EFFECTIVE_ID, photo: photoDataURL }),
    }),
    FUTURE_SELF_GENERATION_TIMEOUT_MS,
    "Future-self image generation timed out."
  );
  if (!response.ok) throw new Error(`Future-self API returned HTTP ${response.status}`);
  const json = await response.json();
  if (!Array.isArray(json.images) || json.images.length === 0) {
    throw new Error("Future-self API response was missing a non-empty images[] array.");
  }
  return json.images;
}

let capturedSelfPhotoDataURL = null;
let futureSelfImagesPromise  = null;
let photoGenerationFailed    = false;

// Custom plugin: lets the participant take, preview, and retake a still
// photo from the camera stream initialized by the preceding
// @jspsych/plugin-initialize-camera trial.
class PhotoCaptureTrial {
  static info = { name: "photo-capture", parameters: {} };
  constructor(jsPsych) { this.jsPsych = jsPsych; }
  trial(display_element, trial) {
    const stream = this.jsPsych.pluginAPI.getCameraStream();

    display_element.innerHTML = `
      <div class="instr-wrap" style="text-align:center">
        <h2>Take your photo</h2>
        <p>Center your face in the frame, then press "Take Photo".</p>
        <video id="pc-video" autoplay playsinline muted
               style="width:400px;max-width:90vw;border-radius:8px;transform:scaleX(-1)"></video>
        <canvas id="pc-canvas" style="display:none"></canvas>
        <div id="pc-preview" style="display:none">
          <img id="pc-preview-img" style="width:400px;max-width:90vw;border-radius:8px;transform:scaleX(-1)">
        </div>
        <p>
          <button class="jspsych-btn" id="pc-take">Take Photo</button>
          <button class="jspsych-btn" id="pc-retake" style="display:none">Retake</button>
          <button class="jspsych-btn" id="pc-confirm" style="display:none">Continue</button>
        </p>
      </div>`;

    const video      = display_element.querySelector("#pc-video");
    const canvas     = display_element.querySelector("#pc-canvas");
    const preview    = display_element.querySelector("#pc-preview");
    const previewImg = display_element.querySelector("#pc-preview-img");
    const takeBtn    = display_element.querySelector("#pc-take");
    const retakeBtn  = display_element.querySelector("#pc-retake");
    const confirmBtn = display_element.querySelector("#pc-confirm");

    video.srcObject = stream;
    let dataURL = null;

    takeBtn.addEventListener("click", () => {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
      dataURL = canvas.toDataURL("image/jpeg", 0.85);
      previewImg.src = dataURL;
      video.style.display   = "none";
      preview.style.display = "block";
      takeBtn.style.display    = "none";
      retakeBtn.style.display  = "inline-block";
      confirmBtn.style.display = "inline-block";
    });

    retakeBtn.addEventListener("click", () => {
      dataURL = null;
      video.style.display   = "block";
      preview.style.display = "none";
      takeBtn.style.display    = "inline-block";
      retakeBtn.style.display  = "none";
      confirmBtn.style.display = "none";
    });

    confirmBtn.addEventListener("click", () => {
      stream.getTracks().forEach(t => t.stop());
      capturedSelfPhotoDataURL = dataURL;
      this.jsPsych.finishTrial({ photo_captured: true }); // no image payload recorded — see PRIVACY note
    });
  }
}

// Custom plugin: blocking "please wait" screen while generateFutureSelfImages()
// resolves. On success/failure, writes (or fails to write) the localStorage
// handoff that iat5_future_self_pictorial.html will later consume.
class WaitForFutureSelfTrial {
  static info = { name: "wait-for-future-self", parameters: {} };
  constructor(jsPsych) { this.jsPsych = jsPsych; }
  trial(display_element, trial) {
    display_element.innerHTML = `
      <div class="instr-wrap" style="text-align:center">
        <p style="font-size:18px">Preparing your future self image…</p>
        <p style="font-size:14px;color:#555">This can take up to a minute.</p>
      </div>`;

    (futureSelfImagesPromise || Promise.reject(new Error("No photo was captured.")))
      .then((images) => {
        try {
          localStorage.setItem(FUTURE_SELF_STORAGE_KEY, JSON.stringify({
            selfPhoto:    capturedSelfPhotoDataURL,
            futureImages: images,
          }));
        } catch (err) {
          console.error("Could not store future-self images in localStorage:", err);
          photoGenerationFailed = true;
        }
        this.jsPsych.finishTrial({ generation_ok: !photoGenerationFailed });
      })
      .catch((err) => {
        console.error("Future-self image generation failed:", err);
        photoGenerationFailed = true;
        try {
          localStorage.setItem(FUTURE_SELF_STORAGE_KEY, JSON.stringify({ failed: true }));
        } catch (e) { /* nothing more we can do */ }
        this.jsPsych.finishTrial({ generation_ok: false });
      });
  }
}

const overallIntro = instrSlide(
  "<h2 style='text-align:center'>Welcome</h2>" +
  "<p>Before starting, we will take a photo of you using your webcam.</p>" +
  "<p>This photo will be processed to generate a computer-generated image of your future self, " +
  "which will be used later in the session.</p>" +
  "<p class='spacebar-note'>Press SPACEBAR to begin.</p>"
);

const cameraInitTrial = {
  type: jsPsychInitializeCamera,
  data: { block: "camera_init" },
};

const photoCaptureTrial = {
  type: PhotoCaptureTrial,
  data: { block: "photo_capture" },
  on_finish: function () {
    futureSelfImagesPromise = generateFutureSelfImages(capturedSelfPhotoDataURL);
  },
};

const waitForFutureSelfTrial = {
  type: WaitForFutureSelfTrial,
  data: { block: "future_self_wait" },
};

const photoDoneTrial = {
  type:           jsPsychHtmlKeyboardResponse,
  stimulus:       "<p style='font-family:Helvetica,Arial,sans-serif;font-size:22px;color:#000'>Photo saved. Continuing…</p>",
  trial_duration: 1200,
  choices:        "NO_KEYS",
  data:           { block: "end" },
};

// A tiny 1x1 placeholder PNG — stands in for a real photo/generated image
// so the skip button can seed localStorage and let iat5's actual IAT
// trials be exercised too, without a camera or a working
// FUTURE_SELF_API_URL (neither of which testing should depend on).
const PLACEHOLDER_IMAGE_DATA_URL =
  "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=";

function finishAndRedirect() {
  const params = new URLSearchParams({
    subject_ID:             SUBJECT_ID,
    photoGenerationStatus:  photoGenerationFailed ? "failed" : "ok",
  });
  setTimeout(function () {
    window.location.href = QUALTRICS_SURVEY_URL + "?" + params.toString();
  }, 500);
}

function skipToEnd() {
  try {
    localStorage.setItem(FUTURE_SELF_STORAGE_KEY, JSON.stringify({
      selfPhoto:    PLACEHOLDER_IMAGE_DATA_URL,
      futureImages: [PLACEHOLDER_IMAGE_DATA_URL],
    }));
  } catch (e) {
    console.error("Could not seed placeholder future-self data:", e);
  }
  finishAndRedirect();
}

const jsPsych = initJsPsych({
  show_progress_bar:    true,
  message_progress_bar: "Progress",
  on_finish: finishAndRedirect,
});

addSkipButtonIfEnabled(skipToEnd);

jsPsych.run([
  overallIntro,
  cameraInitTrial,
  photoCaptureTrial,
  waitForFutureSelfTrial,
  photoDoneTrial,
]);
</script>
</body>
</html>
