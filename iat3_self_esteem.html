<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Self-Esteem IAT</title>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-iat-html@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <script src="iat_common.js"></script>
  <style>
    body, .jspsych-display-element, .jspsych-content-wrapper {
      background-color: #fff !important;
      color: #000 !important;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .jspsych-content { max-width: 800px; padding-top: 0.5em !important; padding-bottom: 0.5em !important; }
    .iat-word {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: bold;
      color: #000;
    }
    .iat-attr   { color: #000; }
    .iat-attr-b { color: #000; }
    .iat-error { font-size: 90px; font-weight: bold; color: red; line-height: 1; }
    .instr-wrap {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      max-width: 680px;
      margin: 0 auto;
      text-align: left;
      color: #000;
    }
    .instr-wrap h2 { text-align: center; margin-bottom: 14px; font-size: 18px; }
    .key-box {
      display: inline-block;
      border: 2px solid #333;
      border-radius: 4px;
      padding: 1px 10px;
      font-family: monospace;
      font-size: 19px;
      font-weight: bold;
      background: #f0f0f0;
      color: #000;
    }
    .cat-tag {
      display: inline-block;
      background: #004080;
      color: #fff;
      border-radius: 4px;
      padding: 1px 10px;
      font-weight: bold;
    }
    .cat-tag.attr { background: #005f00; }
    .spacebar-note {
      margin-top: 28px;
      text-align: center;
      font-weight: bold;
      font-size: 19px;
    }
  </style>
</head>
<body>

<script>
"use strict";

/* ============================================================
   Self-Esteem IAT (standalone page)
   Split out of the combined 5-task experiment so Qualtrics can randomly
   route participants to this IAT alone as part of a 2x2 design. See
   iat_common.js for the shared engine.

   Embedded data returned to Qualtrics: subject_ID, iat3_d, iat3_da,
   iat3_db, iat3_pctCorrect, iat3_propRT300, iat3_exclude,
   iat3_conditionOrder, iat3_rtCompatS/L, iat3_rtIncompatS/L.
   ============================================================ */

// targetA = Self (LEFT); targetB = Other (RIGHT)
// attrA   = Pleasant;  attrB = Unpleasant (same words as Future Self IAT)
// — matched to selfesteemiat_stimuli_inc.iqjs
const SELF_WORDS  = ["I", "Me", "My", "Mine", "Self"];
const OTHER_WORDS = ["They", "Them", "Their", "Theirs", "Others"];
const SE_ATTR_A   = ["Joy", "Warmth", "Gold", "Happy", "Smile", "Pleasure"];
const SE_ATTR_B   = ["Vomit", "Agony", "Pain", "Stink", "Filth", "Death"];

const IAT3 = {
  name: "iat3", group: groupForIAT("iat3"),
  targetA: { label: "Self",       stimuli: SELF_WORDS  },
  targetB: { label: "Other",      stimuli: OTHER_WORDS },
  attrA:   { label: "Pleasant",   words:   SE_ATTR_A   },
  attrB:   { label: "Unpleasant", words:   SE_ATTR_B   },
  intro:
    `<p style="text-align:center;font-size:20px;font-weight:bold">Self-Esteem IAT</p>` +
    `<p>In this task, you will see words related to the <strong>Self</strong> ` +
    `and <strong>Others</strong>, along with words that are either ` +
    `<span style="color:#005f00;font-weight:bold">Pleasant</span> ` +
    `or <span style="color:red;font-weight:bold">Unpleasant</span>.</p>` +
    `<p><span style="color:#005f00;font-weight:bold">Pleasant words:</span> ` +
    `Joy, Warmth, Gold, Happy, Smile, Pleasure</p>` +
    `<p><span style="color:red;font-weight:bold">Unpleasant words:</span> ` +
    `Vomit, Agony, Pain, Stink, Filth, Death</p>` +
    `<p>Sort the items into categories as quickly as possible ` +
    `using the ${K("e")} key (left hand) and the ${K("i")} key (right hand).</p>` +
    `<p>Go <strong>as fast as you can</strong> while making as few errors as possible. ` +
    `If you make an error, a red <span style="color:red;font-weight:bold">X</span> will appear — ` +
    `press the other key to continue.</p>` +
    `<p class="spacebar-note">Press the SPACE BAR to begin.</p>`,
};

const jsPsych = initJsPsych({
  show_progress_bar:    true,
  message_progress_bar: "Progress",
  on_trial_start: function () {
    addSkipButtonIfEnabled(() => finishAndReturnToQualtrics(jsPsych, "iat3", IAT3.group));
  },
  on_finish: function () {
    finishAndReturnToQualtrics(jsPsych, "iat3", IAT3.group);
  },
});

jsPsych.run([
  ...buildIAT(IAT3),
  finalTrial,
]);
</script>
</body>
</html>
